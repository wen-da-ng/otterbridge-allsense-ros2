name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: repo
      # The Python client and the test kit (fake phone). Until both are on PyPI they come from their repos;
      # while those are private, add a read-only TESTKIT_TOKEN secret that can read both.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: wen-da-ng/otterbridge-allsense-python
          token: ${{ secrets.TESTKIT_TOKEN || github.token }}
          path: python
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: wen-da-ng/otterbridge-allsense-protocol
          token: ${{ secrets.TESTKIT_TOKEN || github.token }}
          path: testkit
      - name: Build, unit tests, bridge against the fake phone
        shell: bash
        run: REPO=$PWD/repo PYTHON_SRC=$PWD/python TESTKIT_SRC=$PWD/testkit bash repo/tools/test_in_docker.sh
